<!-- ── ESTILOS SECCIÓN OFERTAS ── -->
<style>
  .ofertas-section {
    padding: 60px 20px;
    background: #f8f8f6;
    border-top: 1px solid #e0ddd8;
  }
  .ofertas-section h2 {
    text-align: center;
    font-size: clamp(22px, 3vw, 32px);
    font-weight: 700;
    color: #1a1a1a;
    margin: 0 0 8px;
    letter-spacing: -0.5px;
  }
  .ofertas-section .subtitulo {
    text-align: center;
    color: #666;
    font-size: 15px;
    margin: 0 0 32px;
  }
  .ofertas-grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    gap: 12px;
    width: 100%;
  }
  .oferta-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 6px;
    background: #e0ddd8;
    min-height: 180px;
  }
  .oferta-img-wrap {
    overflow: hidden;
    border-radius: 6px;
    box-shadow: 0 2px 12px rgba(0,0,0,.08);
  }
  /* Layouts */
  .ofertas-grid.layout-h1x2 { grid-template-columns: 1fr 1fr; }
  .ofertas-grid.layout-top2x1 { grid-template-columns: 1fr 1fr; }
  .ofertas-grid.layout-top2x1 .oferta-img-wrap:nth-child(3) { grid-column: 1 / -1; }
  .ofertas-grid.layout-bot1x2 { grid-template-columns: 1fr 1fr; }
  .ofertas-grid.layout-bot1x2 .oferta-img-wrap:first-child { grid-column: 1 / -1; }
  .ofertas-grid.layout-2x2 { grid-template-columns: 1fr 1fr; }
  .ofertas-grid.layout-tira {
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    grid-auto-rows: 220px;
  }
  .oferta-img-wrap { min-height: 200px; }
  @media (max-width: 600px) {
    .ofertas-grid { grid-template-columns: 1fr !important; }
    .ofertas-grid .oferta-img-wrap { grid-column: auto !important; }
  }
</style>

<!-- ── SECCIÓN ── -->
<section class="ofertas-section" id="ofertas">
  <h2>Ofertas y Promociones</h2>
  <p class="subtitulo">Equipamientos seleccionados del mes</p>
  <div class="ofertas-grid" id="ofertas-grid">
    <!-- Cargado dinámicamente -->
  </div>
</section>

<!-- ── SCRIPT CARGA OFERTAS ── -->
<script>
(async function cargarOfertas() {
  const grid = document.getElementById('ofertas-grid');
  if (!grid) return;
  try {
    const res = await fetch(
      `${SB_URL}/rest/v1/config_app?clave=in.(ofertas_layout,ofertas_imagenes)&select=clave,valor`,
      { headers: { 'apikey': SB_ANON, 'Authorization': `Bearer ${SB_ANON}` } }
    );
    const cfg = await res.json();
    let layout = '2x2', imgs = [];
    if (Array.isArray(cfg)) {
      cfg.forEach(r => {
        if (r.clave === 'ofertas_layout') layout = r.valor || '2x2';
        if (r.clave === 'ofertas_imagenes')
          imgs = (r.valor || '').split(',').map(s => s.trim()).filter(Boolean);
      });
    }
    if (!imgs.length) {
      grid.closest('.ofertas-section').style.display = 'none';
      return;
    }
    grid.className = `ofertas-grid layout-${layout}`;
    grid.innerHTML = imgs.map(url => `
      <div class="oferta-img-wrap">
        <img class="oferta-img" src="${url}" alt="Oferta Muñoz Marchesi" loading="lazy"/>
      </div>`).join('');
  } catch(e) {
    grid.closest('.ofertas-section').style.display = 'none';
  }
})();
</script>
